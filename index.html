<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C62828">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Dk Smart Donor – Blood Bank Bangladesh</title>
<style>
:root{--bg:#fdf6f6;--card:#fff;--tx:#2a1a1a;--mu:#7a6666;--pr:#c62828;--pr2:#8e0000;--bd:#f0d9d9;--ok:#2e7d32;--sf:#fff0f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1a1111;--card:#261818;--tx:#f5e8e8;--mu:#b89c9c;--bd:#412828;--sf:#331c1c;--pr:#ef5350}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1a1111;--card:#261818;--tx:#f5e8e8;--mu:#b89c9c;--bd:#412828;--sf:#331c1c;--pr:#ef5350}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 "Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pr2);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(135deg,var(--pr2),#c62828);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px}
header b{font-size:18px;flex:1}header small{display:block;font-size:11px;opacity:.85;font-weight:400}
.lg{border:1px solid #fff9;background:#fff2;color:#fff;border-radius:20px;padding:4px 12px;font:inherit;cursor:pointer}
main{max-width:960px;margin:0 auto;padding:14px}
.pg{display:none}.pg.on{display:block}
.hero{background:linear-gradient(135deg,#c62828,#8e0000);color:#fff;border-radius:18px;padding:20px}
.hero h1{margin:0 0 4px;font-size:22px}.hero p{margin:0 0 14px;opacity:.9}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.st div{background:#fff2;border-radius:12px;padding:8px;text-align:center}.st b{display:block;font-size:20px}.st span{font-size:12px;opacity:.9}
.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--pr);color:#fff;text-decoration:none;display:inline-block}
.btn.w{background:#fff;color:var(--pr2)}.btn.o{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}.btn.g{background:#25a244}.btn.s{padding:6px 12px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
h2{font-size:18px;margin:20px 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:5px 14px;font:inherit;font-weight:700;cursor:pointer}
.chip.on{background:var(--pr);border-color:var(--pr);color:#fff}
#qc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}#qc .chip{padding:10px 0;font-size:16px;text-align:center}
#fg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#fg .chip{padding:10px 0;font-size:16px;text-align:center}
nav button{position:relative}.nb{position:absolute;top:2px;left:calc(50% + 8px);background:var(--pr);color:#fff;border-radius:10px;font-size:10px;min-width:16px;padding:0 4px;line-height:16px}.nb:empty{display:none}.cw{height:calc(100dvh - 300px);min-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--sf);border-radius:14px;margin-bottom:10px}.bb{max-width:78%;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--bd);overflow-wrap:anywhere}.bb.me{align-self:flex-end;background:var(--pr);border-color:var(--pr);color:#fff}.bb small{display:block;font-size:10px;opacity:.7;margin-top:2px}
.inf{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd);font-size:13px;color:var(--mu)}.inf .w{grid-column:1/-1;overflow-wrap:anywhere}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:#333;color:#fff;padding:10px 16px;border-radius:12px;max-width:88%;z-index:200;opacity:0;pointer-events:none;transition:.3s;text-align:center;font-size:14px}#toast.on{opacity:1;transform:translateX(-50%)}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;margin-bottom:14px;box-shadow:0 6px 20px #0000000d}
.pcov{height:92px;background:linear-gradient(135deg,#8e0000,#c62828 55%,#ef5350);position:relative;overflow:hidden}.pcov::after{content:"";position:absolute;right:-20px;top:-30px;width:140px;height:140px;border-radius:50%;background:#ffffff1f}
.pav{width:84px;height:84px;border-radius:50%;border:4px solid var(--card);box-shadow:0 4px 14px #0003;margin:-44px auto 0;display:grid;place-items:center;font-size:34px;font-weight:800;color:var(--pr);position:relative;background:linear-gradient(135deg,var(--sf),var(--card))}
.pbd{position:absolute;right:-8px;bottom:-4px;background:var(--pr);color:#fff;font-size:13px;border-radius:12px;padding:1px 8px;border:2px solid var(--card)}
.pnm{text-align:center;padding:8px 16px 16px}.pnm b{font-size:20px;display:block}.pnm .mu{display:block;margin:2px 0 8px}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--bd)}.pstats div{padding:12px 4px;text-align:center;border-right:1px solid var(--bd);min-width:0}.pstats div:last-child{border:0}.pstats b{display:block;font-size:14px;overflow-wrap:anywhere}.pstats span{font-size:11px;color:var(--mu)}
.pf{padding:16px}.pf h3{margin:0 0 12px;font-size:16px}.pf label{display:block;font-weight:600}.pf input,.pf select,.pf textarea{border-radius:12px;background:var(--bg)}
.pg2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.pg2>div{min-width:0}.pg2 .full{grid-column:1/-1}
